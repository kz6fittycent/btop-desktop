
name: 🧪 Test snap can be built on x86_64
on:
  workflow_dispatch:
  push:
   branches: [ main ]
   tags-ignore:
      - '*.*'     
   paths:
      - 'src/**'
      - '!src/osx/**'
      - '!src/freebsd/**'
      - 'include/**'
      - 'Makefile'
      - '.github/workflows/test-snap-can-build.yml'
  pull_request:
   branches: [ main ]
   paths:
      - 'src/**'
      - '!src/osx/**'
      - '!src/freebsd/**'
      - 'include/**'
      - 'Makefile'
      - '.github/workflows/test-snap-can-build.yml'
 
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        
    steps:
      - uses: actions/checkout@v7

      - uses: canonical/setup-lxd@v1

      - name: Build snap
        id: build
        env:
          SNAPCRAFT_BUILD_INFO: 1
        run: |
          sudo snap install snapcraft --classic
          snapcraft pack
          echo "snap=$(ls *.snap)" >> "$GITHUB_OUTPUT"

      - uses: snapcrafters/ci/review-snap@main
        with:
          snap: ${{ steps.build.outputs.snap }}
          is-classic: 'false'
